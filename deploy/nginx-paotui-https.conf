# Production configuration for the dedicated paotui.shuge.work virtual host.
server {
    listen 80;
    listen [::]:80;
    server_name paotui.shuge.work;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://paotui.shuge.work$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paotui.shuge.work;
    root /var/www/paotui/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/paotui.shuge.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paotui.shuge.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
