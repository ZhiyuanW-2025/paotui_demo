# Standalone Nginx template. Adjust the root to the selected server's web directory.
# If using a hosting panel, configure this site through that panel instead.
server {
    listen 80;
    server_name paotui.shuge.work;
    root /var/www/paotui/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
